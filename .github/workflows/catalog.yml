name: Update library catalog

on:
  push:
    branches: [main]
    paths:
      - "library/files/**"
      - "library/meta.json"
      - "library/packs/**"
  workflow_dispatch:

concurrency:
  group: catalog
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis tools
        run: pip install numpy soundfile librosa

      - name: Analyse new files and build catalog.json
        run: python tools/build_catalog.py

      - name: Commit catalog
        run: |
          git config user.name "AZ BETAS bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A library
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Katalog yangilandi"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
